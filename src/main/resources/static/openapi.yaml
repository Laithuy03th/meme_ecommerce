          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCallbackRequest'
      responses:
        '200':
          description: Callback processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          description: Order not found

  /api/v1/payments/vnpay-callback:
    get:
      tags:
        - "CLIENT - Payments"
      summary: VNPay Callback (Redirect/IPN)
      description: Handle callback from VNPay via Query Params
      security: []
      parameters:
        - in: query
          name: vnp_TxnRef
          schema: { type: string }
        - in: query
          name: vnp_Amount
          schema: { type: string }
        - in: query
          name: vnp_ResponseCode
          schema: { type: string }
        - in: query
          name: vnp_SecureHash
          schema: { type: string }
      responses:
        '200':
          description: Callback processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'

  /api/v1/payments/momo-callback:
    post:
      tags:
        - "CLIENT - Payments"
      summary: Momo Callback (IPN)
      description: Handle callback from Momo via JSON Body
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Callback processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'

  /api/v1/payments/status/{orderId}:
    get:
      tags:
        - "CLIENT - Payments"
      summary: Check payment status
      description: Check current payment status of an order
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Payment status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order not found

  /api/v1/payments/refund/{orderId}:
    post:
      tags:
        - "CLIENT - Payments"
      summary: Request payment refund
      description: Process refund for a paid order (not available for COD)
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: reason
          schema:
            type: string
          description: Reason for refund
      responses:
        '200':
          description: Refund processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Cannot process refund (order not paid or COD)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order not found


  # ---- Re-order (NEW) ----
  /api/v1/users/me/orders/{orderId}/reorder:
    post:
      tags:
        - "CLIENT - Orders"
      summary: Re-order - add all items from old order to cart
      description: |
        One-click re-purchase feature (Shopee-level).
        Adds all items from previous order to cart with stock validation.
        Out-of-stock items are skipped with warning.
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the order to re-order
      responses:
        '200':
          description: Items added to cart successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order not found or not your order



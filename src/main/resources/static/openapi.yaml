          description: List of suggestions
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /api/chatbot/init:
    post:
      tags:
        - "Chatbot"
      summary: Initialize Knowledge Base (Admin)
      responses:
        '200': { description: Initialized }


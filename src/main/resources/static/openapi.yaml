  # ---- Chatbot (AI) ----
  /api/chatbot/message:
    post:
      tags:
        - "Chatbot"
      summary: Send message to AI Chatbot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, example: "tim ao thun" }
                sessionId: { type: string, example: "uuid-1234" }
                userId: { type: integer, format: int64 }
      responses:
        '200':
          description: AI Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response: { type: string }
                  intent: { type: string }
                  sessionId: { type: string }
                  data: { type: object }
                  requiresAuth: { type: boolean }
                  quickReplies:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        value: { type: string }
                        icon: { type: string }

  /api/chatbot/history/{sessionId}:
    get:
      tags:
        - "Chatbot"
      summary: Get chat history
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Chat history list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties: # Same as ChatResponse
                    response: { type: string }
                    intent: { type: string }
  
  /api/chatbot/suggestions:
    get:

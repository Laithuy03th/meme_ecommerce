openapi: 3.0.3
info:
  title: MyWeb E-commerce API
  version: "1.0.0"
  description: |
    REST API for MyWeb ecommerce (clothes, dresses, shoes).
    
    **Auth**: JWT Bearer. Public endpoints: `/api/v1/health`, `/api/v1/auth/**`, `/api/v1/categories/**`, `/api/v1/products/**`.
    All others require JWT. Admin endpoints additionally require `ROLE_ADMIN`.
servers:
  - url: http://localhost:8080
    description: Local dev

tags:
  - name: "CLIENT - Authentication"
    description: "User authentication endpoints"
  - name: "CLIENT - Profile & Addresses"
    description: "User profile and address management"
  - name: "CLIENT - Products & Catalog"
    description: "Browse products, categories, search"
  - name: "CLIENT - Cart"
    description: "Shopping cart management"
  - name: "CLIENT - Wishlist"
    description: "Favorite products management"
  - name: "CLIENT - Orders"
    description: "Order placement and tracking"
  - name: "CLIENT - Reviews"
    description: "Product reviews and ratings"
  - name: "CLIENT - Vouchers"
    description: "Discount voucher validation"
  - name: "CLIENT - Payments"
    description: "Payment processing and status checking"
  - name: "ADMIN - Dashboard"
    description: "Admin statistics and analytics"
  - name: "ADMIN - User Management"
    description: "Manage users, roles, permissions"
  - name: "ADMIN - Product Management"
    description: "CRUD operations for products"
  - name: "ADMIN - Order Management"
    description: "View and update order status"
  - name: "ADMIN - Voucher Management"
    description: "Create and manage discount vouchers"
  - name: "ADMIN - Review Moderation"
    description: "Moderate user reviews"
  - name: "ADMIN - File Management"
    description: "Upload images and files"
  - name: "ADMIN - Category Management"
    description: "CRUD operations for categories"
  - name: "ADMIN - Product Variant Management"
    description: "Manage product variants (size, color, stock)"

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      in: query
      name: page
      schema:
        type: integer
        minimum: 0
        default: 0
      description: 0-based page index
    SizeParam:
      in: query
      name: size
      schema:
        type: integer
        minimum: 1
        default: 20
      description: Page size
    ProductSortParam:
      in: query
      name: sortBy
      schema:
        type: string
        enum: [newest, oldest, priceAsc, priceDesc]
        default: newest
      description: Sort option
    ProductKeywordParam:
      in: query
      name: keyword
      schema:
        type: string
      description: Full-text keyword for products
    ProductCategoryParam:
      in: query
      name: category
      schema:
        type: string
      description: Category slug filter
    CommonStatusParam:
      in: query
      name: status
      schema:
        type: string
      description: Optional status filter

  responses:
    Unauthorized:
      description: Missing/invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not allowed (e.g., missing ADMIN role)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string

    # ---- Auth / User ----
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        fullName:
          type: string
        phone:
          type: string
        roles:
          type: array
          items:
            type: string
        avatarUrl:
          type: string
        memberSince:
          type: string
        totalOrders:
          type: integer
        totalSpent:
          type: number
          format: double
        membershipLevel:
          type: string
        verified:
          type: boolean
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
          description: Pattern ^[0-9+\-()\s]{6,20}$
        gender:
          type: string
          description: Optional. Example values MALE/FEMALE/OTHER
        dateOfBirth:
          type: string
          description: Optional ISO-8601 yyyy-MM-dd
    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, format: password }
        newPassword: { type: string, format: password }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, format: password }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token (expires in 15 minutes) - use in Authorization header
        refreshToken:
          type: string
          nullable: true
          description: | 
            JWT refresh token - WILL BE NULL in response!
            Actual refresh token is stored in HttpOnly cookie for security (XSS protection).
            Frontend should NOT store this value.
        tokenType:
          type: string
          default: Bearer
        user:
          $ref: '#/components/schemas/UserResponse'
      example:
        accessToken: "eyJhbGciOiJIUzUxMiJ9..."
        refreshToken: null
        tokenType: "Bearer"
        user:
          id: 1
          email: "user@example.com"
          fullName: "John Doe"

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Valid refresh token

    # ---- Address ----
    AddressRequest:
      type: object
      required: [fullName, phone, addressLine1]
      properties:
        fullName:
          type: string
        phone:
          type: string
        addressLine1:
          type: string
        ward:
          type: string
        district:
          type: string
        province:
          type: string
        country:
          type: string
          default: Vietnam
        label:
          type: string
        zipCode:
          type: string
        isDefault:
          type: boolean
          default: false
    AddressResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        phone:
          type: string
        addressLine1:
          type: string
        ward:
          type: string
        district:
          type: string
        province:
          type: string
        country:
          type: string
        label:
          type: string
        zipCode:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ---- Category ----
    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        imageUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        parentId:
          type: integer
          format: int64
          nullable: true
        parentName:
          type: string
          nullable: true
        sortOrder:
          type: integer
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
          description: Auto-generated if empty
        description:
          type: string
        parentId:
          type: integer
          format: int64
          nullable: true
        sortOrder:
          type: integer
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
        imageUrl:
          type: string
          description: URL of the category thumbnail image

    # ---- Product ----
    AdminProductRequest:
      type: object
      required: [name, slug, categoryId, basePrice]
      properties:
        name:
          type: string
        slug:
          type: string
        shortDesc:
          type: string
        longDesc:
          type: string
        categoryId:
          type: integer
          format: int64
        basePrice:
          type: number
          format: double
        stockQuantity:
          type: integer
        thumbnailUrl:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DRAFT]
        imageUrls:
          type: array
          items:
            type: string
          description: List of additional product image URLs
    AdminProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        shortDesc:
          type: string
        longDesc:
          type: string
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        categorySlug:
          type: string
        basePrice:
          type: number
          format: double
        stockQuantity:
          type: integer
        thumbnailUrl:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DRAFT]
        imageUrls:
          type: array
          items:
            type: string
          description: List of additional product image URLs
    ProductImageResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        imageUrl:
          type: string
        thumbnail:
          type: boolean
        sortOrder:
          type: integer
    ProductVariantResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        color:
          type: string
        size:
          type: string
        price:
          type: number
          format: double
          nullable: true
        stock:
          type: integer
        status:
          type: string

    ProductVariantRequest:
      type: object
      required: [color, size, stock]
      properties:
        sku:
          type: string
        color:
          type: string
        size:
          type: string
        price:
          type: number
          format: double
          nullable: true
          description: If null, use product's basePrice
        stock:
          type: integer
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE

    ProductListItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        thumbnailUrl:
          type: string
        price:
          type: number
          format: double
        categorySlug:
          type: string
        categoryName:
          type: string
        createdAt:
          type: string
          format: date-time

    ProductSuggestionResponse:
      type: object
      description: Simplified product data for search autocomplete/suggestions
      properties:
        id:
          type: integer
          format: int64
          description: Product ID
        name:
          type: string
          description: Product name
        slug:
          type: string
          description: URL-friendly slug for navigation
        thumbnailUrl:
          type: string
          description: Product thumbnail image URL
        price:
          type: number
          format: double
          description: Product base price
        categoryName:
          type: string
          description: Category name for context

    SearchKeywordSuggestion:
      type: object
      description: Popular search keyword for quick access on homepage
      properties:
        keyword:
          type: string
          description: Search keyword
          example: "dress"
        category:
          type: string
          description: Category name
          example: "Fashion"
        categorySlug:
          type: string
          description: Category slug for filtering
          example: "fashion"

    ProductDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        shortDesc:
          type: string
        longDesc:
          type: string
        categorySlug:
          type: string
        categoryName:
          type: string
        basePrice:
          type: number
          format: double
        thumbnailUrl:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DRAFT]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImageResponse'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariantResponse'

    # ---- Cart ----
    CartItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        variantId:
          type: integer
          format: int64
          nullable: true
        quantity:
          type: integer
          minimum: 1
    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
    CartItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        variantId:
          type: integer
          format: int64
          nullable: true
        productName:
          type: string
        productSlug:
          type: string
        thumbnailUrl:
          type: string
        color:
          type: string
        size:
          type: string
        unitPrice:
          type: number
          format: double
        quantity:
          type: integer
        totalPrice:
          type: number
          format: double
    CartResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        totalAmount:
          type: number
          format: double
        totalItems:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemResponse'

    # ---- Orders ----
    CheckoutRequest:
      type: object
      required: [addressId, paymentMethod, shippingMethodId]
      properties:
        addressId:
          type: integer
          format: int64
        shippingMethodId:
          type: integer
          format: int64
          description: Selected shipping method (STANDARD or EXPRESS)
        paymentMethod:
          type: string
          enum: [COD, VNPAY, MOMO]
        voucherCode:
          type: string
          description: Optional discount voucher code
        note:
          type: string
    OrderItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        variantId:
          type: integer
          format: int64
          nullable: true
        productName:
          type: string
        productSlug:
          type: string
        thumbnailUrl:
          type: string
        color:
          type: string
        size:
          type: string
        unitPrice:
          type: number
          format: double
        quantity:
          type: integer
        totalPrice:
          type: number
          format: double
    OrderListResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderNumber: { type: string }
        createdAt: { type: string, format: date-time }
        status: { type: string }
        itemCount: { type: integer }
        totalAmount: { type: number, format: double }
        firstItemImageUrl: { type: string }

    OrderDetailResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderNumber: { type: string }
        createdAt: { type: string, format: date-time }
        status: { type: string }
        timeline:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              timestamp: { type: string, format: date-time }
              completed: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              productName: { type: string }
              productImageUrl: { type: string }
              variantInfo: { type: string }
              quantity: { type: integer }
              price: { type: number, format: double }
        subtotal: { type: number, format: double }
        shippingFee: { type: number, format: double }
        totalAmount: { type: number, format: double }
        shippingAddress:
          type: object
          properties:
            fullName: { type: string }
            addressLine: { type: string }
            phone: { type: string }
        paymentMethod:
          type: object
          properties:
            type: { type: string }
            last4: { type: string }

    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, CONFIRMED, PACKED, SHIPPED, DELIVERED, CANCELED, RETURNED, REFUNDED]
        paymentStatus:
          type: string
          enum: [UNPAID, PAID, FAILED, REFUNDED]
        paymentMethod:
          type: string
          enum: [COD, VNPAY, MOMO]
        totalAmount:
          type: number
          format: double
        shippingFee:
          type: number
          format: double
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'

    AdminOrderSummaryResponse:
      type: object
      description: Summary used in /api/v1/admin/orders (dto.order)
      properties:
        id:
          type: integer
          format: int64
        userEmail:
          type: string
        shippingFullName:
          type: string
        totalAmount:
          type: number
          format: double
        shippingFee:
          type: number
          format: double
        status:
          type: string
          enum: [PENDING, CONFIRMED, PACKED, SHIPPED, DELIVERED, CANCELED, RETURNED, REFUNDED]
        paymentMethod:
          type: string
          enum: [COD, VNPAY, MOMO]
        paymentStatus:
          type: string
          enum: [UNPAID, PAID, FAILED, REFUNDED]
        createdAt:
          type: string
          format: date-time

    AdminOrderItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        productName:
          type: string
        unitPrice:
          type: number
          format: double
        quantity:
          type: integer
        lineTotal:
          type: number
          format: double

    AdminOrderDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, PAID, SHIPPED, COMPLETED, CANCELED]
        paymentMethod:
          type: string
          enum: [COD, VNPAY, MOMO]
        paymentStatus:
          type: string
          enum: [UNPAID, PAID, FAILED, REFUNDED]
        totalAmount:
          type: number
          format: double
        shippingFee:
          type: number
          format: double
        note:
          type: string
        userId:
          type: integer
          format: int64
        userEmail:
          type: string
        shippingFullName:
          type: string
        shippingPhone:
          type: string
        shippingAddressLine1:
          type: string
        shippingWard:
          type: string
        shippingDistrict:
          type: string
        shippingProvince:
          type: string
        shippingCountry:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrderItemResponse'

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, CONFIRMED, PACKED, SHIPPED, DELIVERED, CANCELED, RETURNED, REFUNDED]

    # ---- Payment ----
    PaymentRequest:
      type: object
      required:
        - orderId
      properties:
        orderId:
          type: integer
          format: int64
          description: ID of the order to pay
        returnUrl:
          type: string
          description: URL to redirect after successful payment
          example: "http://localhost:3000/payment/success"
        cancelUrl:
          type: string
          description: URL to redirect if payment is cancelled
          example: "http://localhost:3000/payment/cancel"

    PaymentResponse:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        paymentMethod:
          type: string
          enum: [COD, VNPAY, MOMO]
        paymentStatus:
          type: string
          enum: [UNPAID, PAID, FAILED, REFUNDED]
        paymentUrl:
          type: string
          description: URL to complete payment (for online payment methods)
          example: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html?..."
        amount:
          type: number
          format: double
          description: Total amount to pay
        transactionId:
          type: string
          description: Transaction ID from payment gateway
        message:
          type: string
          description: Status message

    PaymentCallbackRequest:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        transactionId:
          type: string
          description: Transaction ID from payment gateway
        status:
          type: string
          enum: [SUCCESS, FAILED, CANCELLED]
          description: Payment result status
        additionalData:
          type: object
          additionalProperties:
            type: string
          description: Additional data from payment gateway

    AdminUserListItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        fullName:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [ACTIVE, BLOCKED]
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    AdminUserOrderSummaryResponse:
      type: object
      description: Summary inside AdminUserDetailResponse (dto.admin)
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, PAID, SHIPPED, COMPLETED, CANCELED]
        paymentStatus:
          type: string
          enum: [UNPAID, PAID, FAILED, REFUNDED]
        totalAmount:
          type: number
          format: double
        shippingFee:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time

    AdminUserDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        status:
          type: string
          enum: [ACTIVE, BLOCKED]
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        fullName:
          type: string
        phone:
          type: string
        gender:
          type: string
        dateOfBirth:
          type: string
          format: date
          nullable: true
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddressResponse'
        orders:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserOrderSummaryResponse'
    AdminCreateUserRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        fullName: { type: string }
        phone: { type: string }
        roles:
          type: array
          description: "Optional. Example: ['ADMIN', 'CUSTOMER']"
          items:
            type: string

    AdminUpdateUserRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { type: string }

    AdminResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, format: password }

    # ---- Review ----
    ReviewRequest:
      type: object
      required: [orderItemId, rating]
      properties:
        orderItemId:
          type: integer
          format: int64
          description: Order item ID to link review with specific purchase (required for verification)
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        imageUrl:
          type: string

    ReviewResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        username:
          type: string
        userFullName:
          type: string
          description: Kept for backward compatibility
        productId:
          type: integer
          format: int64
        rating:
          type: integer
        comment:
          type: string
        imageUrl:
          type: string
        # Edit tracking (Shopee-level feature)
        editCount:
          type: integer
          description: Number of times review has been edited (max 2)
        isEdited:
          type: boolean
          description: Whether review has been edited
        # Purchase verification
        orderId:
          type: integer
          format: int64
          nullable: true
        orderNumber:
          type: string
          nullable: true
        verifiedPurchase:
          type: boolean
          description: True if user actually purchased this product (Verified Purchase badge)
        adminReply:
          type: string
        adminRepliedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminReplyRequest:
      type: object
      required: [reply]
      properties:
        reply:
          type: string

    # ---- Dashboard ----
    TopProductDto:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        totalSold:
          type: integer
          format: int64
        revenue:
          type: number
          format: double

    DashboardStatsResponse:
      type: object
      properties:
        totalRevenue:
          type: number
          format: double
        todayRevenue:
          type: number
          format: double
        monthRevenue:
          type: number
          format: double
        totalOrders:
          type: integer
          format: int64
        pendingOrders:
          type: integer
          format: int64
        shippingOrders:
          type: integer
          format: int64
        completedOrders:
          type: integer
          format: int64
        canceledOrders:
          type: integer
          format: int64
        totalCustomers:
          type: integer
          format: int64
        newCustomersThisMonth:
          type: integer
          format: int64
        totalProducts:
          type: integer
          format: int64
        lowStockProducts:
          type: integer
          format: int64
        topSellingProducts:
          type: array
          items:
            $ref: '#/components/schemas/TopProductDto'

    ReturnRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string


    # ---- Page wrappers (use 'number' like Spring Page JSON) ----
    Page_AdminProductResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AdminProductResponse'
        number:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    Page_ProductListItemResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductListItemResponse'
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    Page_OrderResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrderResponse'
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    Page_OrderListResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrderListResponse'
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    Page_AdminOrderSummaryResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrderSummaryResponse'
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    Page_AdminUserListItemResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserListItemResponse'
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    # ---- Wishlist ----
    WishlistResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        product: { $ref: '#/components/schemas/ProductListItemResponse' }
        createdAt: {type: string, format: date-time}



    # ---- Vouchers ----
    VoucherValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
        message:
          type: string
        discountAmount:
          type: number
          format: double
        voucher:
          $ref: '#/components/schemas/VoucherResponse'

    VoucherRequest:
      type: object
      required:
        - code
        - discountType
        - discountValue
      properties:
        code:
          type: string
        discountType:
          type: string
          enum: [PERCENT, AMOUNT]
        discountValue:
          type: number
          format: double
        minOrderAmount:
          type: number
          format: double
        maxDiscountAmount:
          type: number
          format: double
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        usageLimit:
          type: integer
        usageLimitPerUser:
          type: integer
        freeShipping:
          type: boolean
        maxShippingDiscount:
          type: number
          format: double
        applicableCategoryIds:
          type: string
          description: "Comma separated category IDs, e.g. '1,2,3'"

    VoucherResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        discountType:
          type: string
        discountValue:
          type: number
          format: double
        minOrderAmount:
          type: number
          format: double
        maxDiscountAmount:
          type: number
          format: double
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        usageLimit:
          type: integer
        usedCount:
          type: integer
        isActive:
          type: boolean
        usageLimitPerUser:
          type: integer
        freeShipping:
          type: boolean
        maxShippingDiscount:
          type: number
          format: double
        applicableCategoryIds:
          type: string



paths:
  # ---- Health ----
  /api/v1/health:
    get:
      security: []
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK

  # ---- Authentication ----
  /api/v1/auth/register:
    post:
      tags:
        - "CLIENT - Authentication"
      security: []
      summary: Register new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /api/v1/auth/login:
    post:
      tags:
        - "CLIENT - Authentication"
      security: []
      summary: Login with email and password
      description: |
        Authenticates user and returns access token in response body.
        **Security**: Refresh token is stored in HttpOnly cookie (not in response).
        Frontend must use `credentials: 'include'` in fetch to receive cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            Login successful. 
            Access token in body, refresh token in HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=eyJhbGci...; Path=/; HttpOnly; Max-Age=604800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /api/v1/auth/refresh:
    post:
      tags:
        - "CLIENT - Authentication"
      security: []
      summary: Refresh access token using refresh token from HttpOnly cookie
      description: |
        Get new access token and refresh token pair.
        **Important**: Refresh token comes from HttpOnly cookie, NOT request body!
        Frontend must use `credentials: 'include'` to send cookies.
        Token rotation: old refresh token is invalidated, new one is set in cookie.
      responses:
        '200':
          description: Token refreshed successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=eyJhbGci...; Path=/; HttpOnly; Max-Age=604800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid or expired refresh token in cookie

  /api/v1/auth/logout:
    post:
      tags:
        - "CLIENT - Authentication"
      summary: Logout, blacklist token, and delete refresh token cookie
      description: |
        Blacklists current access token and deletes refresh token cookie.
        Frontend must use `credentials: 'include'` for cookie deletion.
      responses:
        '204':
          description: Logged out successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=; Path=/; HttpOnly; Max-Age=0

  /api/v1/auth/forgot-password:
    post:
      tags:
        - "CLIENT - Authentication"
      security: []
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Reset email sent if account exists

  /api/v1/auth/reset-password:
    post:
      tags:
        - "CLIENT - Authentication"
      security: []
      summary: Reset password with token from email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset successfully

  /api/v1/auth/change-password:
    post:
      tags:
        - "CLIENT - Authentication"
      summary: Change password for authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed successfully

  /api/v1/secure/hello:
    get:
      summary: Secured hello test
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }



  # ---- Users (me) ----
  /api/v1/users/me:
    get:
      tags:
        - "CLIENT - Profile & Addresses"
      summary: Get current user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags:
        - "CLIENT - Profile & Addresses"
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---- Addresses (me) ----
  /api/v1/users/me/addresses:
    get:
      tags:
        - "CLIENT - Profile & Addresses"
      summary: List my addresses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags:
        - "CLIENT - Profile & Addresses"
      summary: Create address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/me/addresses/{id}:
    put:
      tags:
        - "CLIENT - Profile & Addresses"
      summary: Update address
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags:
        - "CLIENT - Profile & Addresses"
      summary: Delete address
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/users/me/addresses/{id}/default:
    post:
      tags:
        - "CLIENT - Profile & Addresses"
      summary: Set default address
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Cart (me) ----
  /api/v1/users/me/cart:
    get:
      tags:
        - "CLIENT - Cart"
      summary: Get my cart
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/me/cart/items:
    post:
      tags:
        - "CLIENT - Cart"
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/me/cart/items/{itemId}:
    put:
      tags:
        - "CLIENT - Cart"
      summary: Update cart item quantity
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags:
        - "CLIENT - Cart"
      summary: Remove item from cart
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK (cart after removal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Orders (me) ----
  /api/v1/users/me/orders/checkout:
    post:
      tags:
        - "CLIENT - Orders"
      summary: Checkout current cart -> create order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/me/orders:
    get:
      tags:
        - "CLIENT - Orders"
      summary: List my orders
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_OrderListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/me/orders/{orderId}:
    get:
      tags:
        - "CLIENT - Orders"
      summary: Get my order detail
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users/me/orders/{orderId}/cancel:
    put:
      tags:
        - "CLIENT - Orders"
      summary: Cancel my order (if PENDING)
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { description: Cannot cancel }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users/me/orders/{orderId}/return:
    post:
      tags:
        - "CLIENT - Orders"
      summary: Request return (if DELIVERED)
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { description: Cannot return }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Products (public) ----
  /api/v1/products:
    get:
      tags:
        - "CLIENT - Products & Catalog"
      security: []
      summary: List products (public)
      parameters:
        - $ref: '#/components/parameters/ProductCategoryParam'
        - $ref: '#/components/parameters/ProductKeywordParam'
        - in: query
          name: minPrice
          schema:
            type: number
            format: double
          description: Minimum price filter
        - in: query
          name: maxPrice
          schema:
            type: number
            format: double
          description: Maximum price filter
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/ProductSortParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ProductListItemResponse'
  /api/v1/products/slug/{slug}:
    get:
      tags:
        - "CLIENT - Products & Catalog"
      security: []
      summary: Get product by slug (public)
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/products/{id}:
    get:
      tags:
        - "CLIENT - Products & Catalog"
      security: []
      summary: Get product by id (public)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/products/{id}/related:
    get:
      tags:
        - "CLIENT - Products & Catalog"
      security: []
      summary: Get related products (same category)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ProductListItemResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/products/suggestions:
    get:
      tags:
        - "CLIENT - Products & Catalog"
      security: []
      summary: Get search suggestions for autocomplete (public)
      description: |
        Returns product suggestions for search autocomplete.
        Can be filtered by category for category-specific suggestions.
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
          description: Search keyword (minimum 2 characters recommended)
          example: "head"
        - in: query
          name: category
          schema:
            type: string
          description: Category slug to filter suggestions (fashion, beauty, electronics, home-living)
          example: "electronics"
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 20
          description: Maximum number of suggestions to return
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSuggestionResponse'
              example:
                - id: 123
                  name: "Premium Wireless Headphones 5"
                  slug: "premium-wireless-headphones-5"
                  thumbnailUrl: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
                  price: 289.99
                  categoryName: "Electronics"
                - id: 124
                  name: "Ultra Wireless Headphones 12"
                  slug: "ultra-wireless-headphones-12"
                  thumbnailUrl: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
                  price: 299.99
                  categoryName: "Electronics"


  /api/v1/products/search-keywords:
    get:
      tags:
        - "CLIENT - Products & Catalog"
      security: []
      summary: Get popular search keywords for quick access (public)
      description: |
        Returns a curated list of popular search keywords organized by category.
        Displayed when user clicks search box on homepage (like Aristino.com).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchKeywordSuggestion'
              example:
                - keyword: "dress"
                  category: "Fashion"
                  categorySlug: "fashion"
                - keyword: "shoes"
                  category: "Fashion"
                  categorySlug: "fashion"
                - keyword: "headphones"
                  category: "Electronics"
                  categorySlug: "electronics"

  # ---- Categories (public) ----
  /api/v1/categories:
    get:
      tags:
        - "CLIENT - Products & Catalog"
      security: []
      summary: List active categories (public)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'

  # ---- Admin: Dashboard ----
  /api/v1/admin/dashboard:
    get:
      tags:
        - "ADMIN - Dashboard"
      summary: Get dashboard statistics (ADMIN)
      responses:
        '200':
          description: OK
          content:
            application/json:

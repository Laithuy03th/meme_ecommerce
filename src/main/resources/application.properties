spring.config.import=optional:file:.env[.properties]
spring.application.name=main
spring.datasource.url=jdbc:postgresql://localhost:5432/meme_ecommerce
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8080

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# spring.jpa.properties.hibernate.format_sql=true


springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.url=/openapi.yaml

# JWT config
jwt.secret=${JWT_SECRET}

# Access Token: 15 phút (900000 ms)
jwt.expirationMs=900000

# Refresh Token: 7 ngày (604800000 ms)
jwt.refreshExpirationMs=604800000

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.access=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.example.MyWeb=DEBUG

# ---- Email Configuration ----
